################
### Settings ###
################

# Instellingen voor realtimemonitoring.py (geen secrets; die staan in .env, zie env_config.py)
[monitoring]
# Seconden tussen twee meetrondes
interval = 60
# Steden voor OpenWeatherMap, één per regel (ingesprongen). Wordt de 'location'-tag in InfluxDB.
cities =
    Delft
    London
    Maastricht
    Sydney
    Amsterdam
    Schiermonnikoog
    De Bilt
    Caen
    Delfgauw
    Cambridge, GB
# 'location'-tag voor de zonnepaneeldata
solar_location = Delfgauw
# Locatie voor Buienradar: het dichtstbijzijnde weerstation wordt gebruikt
buienradar_city = Delft
buienradar_latitude = 52.0067
buienradar_longitude = 4.3556

# Hue-temperatuursensoren: locatie = uniqueid van de sensor.
# De uniqueid (hardware-adres) blijft gelijk als een sensor opnieuw wordt gekoppeld.
# De locatie wordt de 'sensor'-tag in InfluxDB.
# Hue-bewegingssensor: ground_floor = Toilet, first_floor = Gang 1e etage,
# second_floor = Zolder, trap = Trap.
[hue_temperature_sensors]
ground_floor = 00:17:88:01:02:03:29:c8-02-0402
first_floor = 00:17:88:01:06:f6:6a:51-02-0402
second_floor = 00:17:88:01:02:02:52:a6-02-0402
trap = 00:17:88:01:0e:ba:aa:a7-02-0402

### Instellingen hieronder zijn voor InverterExport (zonnepanelen) ###

[general]
# Output-plugin(s) voor de inverterdata (alleen InfluxDBOutput bestaat)
enabled_plugins = InfluxDBOutput

[logger]
# ip,sn,ip,sn,ip,sn or auto
# IP address of your inverter(s) data logger and S/N of the wifi kit(s)
gateways = 192.168.68.117,1607117551
# Automatically detect logger(s) on the local network
# gateways = auto
# Default for the Wifi module/logger/gateway
port = 8899
# time to wait for inverter logger response
timeout = 10

[log]
# Log:Output
# Possible options: none,console,file (combinations are possible)
# Use none to disable logging
type = console

# Log:level
# Possible options: critical, error, warning, info, debug, notset
level = error

# Log:filename
# Output file for file logger
filename = inverter-export.log
